<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Payment - ReadExcel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full antialiased text-slate-800 flex flex-col justify-between selection:bg-brand-500 selection:text-white">

    <!-- Navigation Header -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- Logo -->
                <a href="/student/dashboard" class="flex items-center gap-3 group">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white shadow-lg shadow-brand-500/30 group-hover:scale-105 transition-transform duration-300">
                        <i class="fa-solid me-0.5 fa-book-open-reader text-xl"></i>
                    </div>
                    <span class="text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-brand-700 to-indigo-600 tracking-tight">ReadExcel</span>
                </a>

                <!-- Back Link -->
                <a href="/student/dashboard" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-600 hover:text-brand-600 transition-colors">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Dashboard
                </a>
            </div>
        </div>
    </header>

    <!-- Main Payment Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
        <div class="w-full max-w-md space-y-6">
            
            <!-- Payment Card -->
            <div class="bg-white border border-slate-200/80 rounded-3xl shadow-xl overflow-hidden p-6 sm:p-8 space-y-6">
                
                <!-- Title Header -->
                <div class="text-center space-y-2">
                    <div class="w-12 h-12 rounded-2xl bg-brand-100 text-brand-600 flex items-center justify-center text-xl font-bold mx-auto mb-3">
                        <i class="fa-solid fa-credit-card"></i>
                    </div>
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight">Monthly Subscription Payment</h1>
                    <p class="text-xs text-slate-500">Rate: <span class="font-bold text-slate-800">500 ETB / month</span></p>
                </div>

                <!-- Form targeting /student/pay with POST -->
                <form action="/student/pay" method="POST" class="space-y-6">
                    
                    <!-- Single Input Field: Number of Months -->
                    <div>
                        <label for="months" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
                            Number of Months
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-calendar-days text-sm"></i>
                            </div>
                            <input 
                                type="number" 
                                id="months" 
                                name="months" 
                                min="1" 
                                value="1" 
                                required 
                                oninput="calculateTotal(this.value)" 
                                placeholder="Enter months" 
                                class="w-full pl-10 pr-4 py-3 text-sm font-semibold rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent bg-slate-50/50"
                            >
                        </div>
                    </div>

                    <!-- Calculated Total Price Display Card -->
                    <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200/80 space-y-2">
                        <div class="flex items-center justify-between text-xs text-slate-500 font-semibold">
                            <span>Subscription Rate</span>
                            <span>500 ETB × <span id="month-count-label">1</span> month(s)</span>
                        </div>
                        <div class="pt-2 border-t border-slate-200/60 flex items-baseline justify-between">
                            <span class="text-sm font-bold text-slate-800">Total Amount</span>
                            <div class="flex items-baseline gap-1">
                                <span class="text-xs font-bold text-brand-600">ETB</span>
                                <span id="total-amount" class="text-3xl font-black text-slate-900">500</span>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full py-4 rounded-xl text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-lg shadow-brand-500/30 hover:shadow-xl transition-all duration-300 flex items-center justify-center gap-2">
                        <span>Proceed to Pay</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </form>

            </div>

            <!-- Guarantee Notice -->
            <div class="text-center text-xs text-slate-400 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-shield-check text-[10px]"></i> Full access to reading passages & audio submissions
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-200 bg-white">
        <p>&copy; ReadExcel Reading Practice Portal. All rights reserved.</p>
    </footer>

    <!-- Total Price Calculation Script -->
    <script>
        function calculateTotal(monthsVal) {
            const months = parseInt(monthsVal) || 1;
            const validMonths = months < 1 ? 1 : months;
            const total = validMonths * 500;
            
            document.getElementById('total-amount').textContent = total.toLocaleString();
            document.getElementById('month-count-label').textContent = validMonths;
        }
    </script>
</body>
</html>
