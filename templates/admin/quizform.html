{% extends 'admin/dash.html' %}

{% block content %}
<div class="max-w-6xl mx-auto p-6">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-200">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">Add Quiz for Passage</h1>
            <p class="text-sm text-gray-500 mt-1">Passage Title: <span class="font-semibold text-gray-700">{{ data.title }}</span> (ID: {{ data.passage_id }})</p>
        </div>
        <a href="/admin/passages" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium px-4 py-2 rounded-lg transition">Back to Passages</a>
    </div>

    <!-- Main Content Split Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Dynamic Form (7 Cols) -->
        <div class="lg:col-span-7 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <form id="quizForm" action="/admin/add/quiz/{{ data.passage_id }}" method="POST">
                <input type="hidden" name="questions_json" id="questions_json">

                <div id="questionsContainer" class="space-y-6">
                    <!-- Dynamic Question Cards Rendered via JS -->
                </div>

                <div class="mt-6 flex gap-4">
                    <button type="button" onclick="addQuestion()" class="flex-1 bg-indigo-50 border border-indigo-200 text-indigo-600 hover:bg-indigo-100 font-semibold py-2.5 px-4 rounded-lg transition text-sm">
                        + Add Question
                    </button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg transition text-sm">
                        Save Quiz
                    </button>
                </div>
            </form>
        </div>

        <!-- Right Column: Live JSON & Passage Preview (5 Cols) -->
        <div class="lg:col-span-5 space-y-6">
            <!-- Passage Reference Card -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-lg font-semibold text-gray-800 mb-2">Passage Preview</h3>
                <div class="bg-gray-50 p-4 rounded-lg max-h-48 overflow-y-auto text-sm text-gray-600 leading-relaxed border border-gray-100">
                    {{ data.passage }}
                </div>
            </div>

            <!-- Live JSON Preview -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-lg font-semibold text-gray-800 mb-2">JSON Data Preview</h3>
                <pre id="jsonPreview" class="bg-gray-900 text-emerald-400 p-4 rounded-lg text-xs font-mono overflow-x-auto max-h-96">[]</pre>
            </div>
        </div>

    </div>
</div>

<script>
let quizData = [];

function addQuestion() {
    quizData.push({
        question: "",
        options: { A: "", B: "", C: "", D: "" },
        correct_answer: "A"
    });
    render();
}

function removeQuestion(index) {
    if (quizData.length === 1) return;
    quizData.splice(index, 1);
    render();
}

function updateQuestion(index, value) {
    quizData[index].question = value;
    updatePreview();
}

function updateOption(qIndex, optKey, value) {
    quizData[qIndex].options[optKey] = value;
    updatePreview();
}

function updateCorrectAnswer(qIndex, value) {
    quizData[qIndex].correct_answer = value;
    updatePreview();
}

function updatePreview() {
    const jsonStr = JSON.stringify(quizData, null, 2);
    document.getElementById('jsonPreview').textContent = jsonStr;
    document.getElementById('questions_json').value = JSON.stringify(quizData);
}

function render() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    quizData.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = "p-5 border border-gray-200 rounded-lg bg-gray-50 relative space-y-4";

        card.innerHTML = `
            <div class="flex justify-between items-center">
                <span class="font-bold text-gray-700 text-sm">Question ${qIndex + 1}</span>
                ${quizData.length > 1 ? `<button type="button" onclick="removeQuestion(${qIndex})" class="text-red-500 hover:text-red-700 text-xs font-semibold">Delete</button>` : ''}
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Question Text</label>
                <input type="text" value="${q.question}" oninput="updateQuestion(${qIndex}, this.value)" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Enter question...">
            </div>

            <div class="grid grid-cols-2 gap-3">
                ${['A', 'B', 'C', 'D'].map(key => `
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1">Option ${key}</label>
                        <input type="text" value="${q.options[key]}" oninput="updateOption(${qIndex}, '${key}', this.value)" 
                            class="w-full px-3 py-1.5 border border-gray-300 rounded-md text-sm focus:ring-1 focus:ring-indigo-500 focus:outline-none" placeholder="Option ${key}">
                    </div>
                `).join('')}
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Correct Answer</label>
                <select onchange="updateCorrectAnswer(${qIndex}, this.value)" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    ${['A', 'B', 'C', 'D'].map(key => `
                        <option value="${key}" ${q.correct_answer === key ? 'selected' : ''}>Option ${key}</option>
                    `).join('')}
                </select>
            </div>
        `;

        container.appendChild(card);
    });

    updatePreview();
}

// Initial setup with one question
addQuestion();

// Form Submit Safety Check
document.getElementById('quizForm').addEventListener('submit', function(e) {
    if (quizData.length === 0 || quizData.some(q => !q.question.trim())) {
        e.preventDefault();
        alert('Please complete all question fields before submitting.');
    }
});
</script>
{% endblock %}
